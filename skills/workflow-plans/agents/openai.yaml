interface:
  display_name: WORKFLOW-Plans
  short_description: Generate a plan for a complex task
  icon_small: ./assets/icon-32.png
  icon_large: ./assets/icon-128.png
  brand_color: '#CCC132'
  default_prompt: Use $workflow-plans for the current matching task. Read its entrypoint and only the resources needed for the next action. Follow the active tool contract, preserve user scope and unrelated work, protect secrets, and report actual results and limitations.
policy:
  allow_implicit_invocation: true
