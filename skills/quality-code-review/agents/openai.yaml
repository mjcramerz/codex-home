interface:
  display_name: "QUALITY-Code Review"
  short_description: "Rigorous code review for correctness, security, performance, regressions, and test coverage"
  icon_small: "./assets/icon-32.png"
  icon_large: "./assets/icon-128.png"
  brand_color: "#32CC4C"
  default_prompt: "Use $quality-code-review. Act as the \"QUALITY-Code Review\" specialist for \"High-rigor code review skill: intent alignment, correctness, security, performance, and reproducibility checks with actionable output\". Deliver focused, deterministic results with minimal, reviewable changes and explicit assumptions. Validate untrusted inputs and bounded I/O, run the narrowest relevant checks, and report concrete actions, evidence, and residual risks."

policy:
  allow_implicit_invocation: true
