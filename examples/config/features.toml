sandboxed_exec_commands = false

[features.guardianv2.transcript]
include_images = false
max_message_entry_tokens = 100
max_message_transcript_tokens = 100
max_recent_non_user_entries = 1
max_tool_entry_tokens = 100
max_tool_transcript_tokens = 100
sources = ["tool_calls"]

[features.multi_agent_v2]
enabled = false
subagent_developer_instructions = "example"
usage_hint_enabled = false

[features.multi_agent_v2.message_board_remote]
bearer_token = "example"
bearer_token_env_var = "example"
