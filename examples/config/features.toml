[features.network_proxy]
allow_local_binding = false
allow_upstream_proxy = false
credential_broker = false
dangerously_allow_all_unix_sockets = false
dangerously_allow_non_loopback_proxy = false
enable_socks5 = false
enable_socks5_udp = false
enabled = false
mode = "limited"
proxy_url = "https://example.invalid"
socks_url = "https://example.invalid"

[features.network_proxy.credentials]

[features.network_proxy.credentials.example]
auth = ["bearer"]
env = ["example"]
header = "example"
patterns = ["example"]
prefix = "example"
url_prefix_from_env = "https://example.invalid"
url_prefixes = ["example"]

[features.network_proxy.domains]
example = "allow"

[features.network_proxy.unix_sockets]
example = "allow"

[features.non_prefixed_mcp_tool_names]
enabled = false
server_names = ["example"]

[features.rollout_budget]
enabled = false
limit_tokens = 1
prefill_token_weight = 1.0
reminder_at_remaining_tokens = [1]
sampling_token_weight = 1.0

[features.token_budget]
auto_compact_fallback_buffer_tokens = 1
auto_compact_fallback_prompt = "example"
enabled = false
guidance_message = "example"
reminder_message_template = "example"
reminder_threshold_tokens = 1
use_history_notes_extension = false
