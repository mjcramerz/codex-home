path = "/data/codex/usr/examples/replace-me"

[features.code_mode]
direct_only_tool_namespaces = ["example"]
enabled = false
excluded_tool_namespaces = ["example"]

[features.guardianv2]
classifier_instructions = "example"
enabled = false
free_guardian = false
max_action_tokens = 100
max_classifier_instruction_tokens = 100
max_parent_compaction_tokens = 100
max_tool_call_lag = 1
reasoning_effort = "high"
