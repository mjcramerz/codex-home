# Generated local MCP registrations only. Merge by server ID, do not append duplicate tables.
# No API values are stored here. The broker reads systemd credentials.
# "configured" follows /etc/codex/mcp/client.json; explicit variants override it.

[mcp_servers."filesystem"]
command = "/usr/local/bin/codex-mcp"
args = ["connect", "filesystem", "--transport", "ssh"]
enabled = true
required = false
startup_timeout_sec = 120
tool_timeout_sec = 180

