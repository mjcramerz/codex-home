interface:
  display_name: Docs Research Workbench
  short_description: Compare official docs and turn findings into engineering decisions
  brand_color: '#0EA5E9'
  default_prompt: Use $docs-research-workbench for the current matching task. Read its entrypoint and only the resources needed for the next action. Follow the active tool contract, preserve user scope and unrelated work, protect secrets, and report actual results and limitations.
dependencies:
  tools:
  - type: mcp
    value: openaiDeveloperDocs
    description: openaiDeveloperDocs MCP server
    transport: streamable_http
    url: https://developers.openai.com/mcp
  - type: mcp
    value: microsoft-learn
    description: microsoft-learn MCP server
    transport: streamable_http
    url: https://learn.microsoft.com/api/mcp
  - type: mcp
    value: jina-ai
    description: jina-ai MCP server
    transport: streamable_http
    url: https://mcp.jina.ai/v1
policy:
  allow_implicit_invocation: true
