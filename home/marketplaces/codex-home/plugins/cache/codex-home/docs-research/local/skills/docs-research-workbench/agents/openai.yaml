interface:
  display_name: "Docs Research Workbench"
  short_description: "Compare official docs and turn findings into engineering decisions"
  brand_color: "#0EA5E9"
  default_prompt: "Use $docs-research-workbench. Act as the Docs Research Workbench specialist. Use current evidence, keep changes reviewable, and report assumptions and validation clearly."

dependencies:
  tools:
    - type: "mcp"
      value: "openaiDeveloperDocs"
      description: "openaiDeveloperDocs MCP server"
      transport: "streamable_http"
      url: "https://developers.openai.com/mcp"
    - type: "mcp"
      value: "microsoft-learn"
      description: "microsoft-learn MCP server"
      transport: "streamable_http"
      url: "https://learn.microsoft.com/api/mcp"
    - type: "mcp"
      value: "jina-ai"
      description: "jina-ai MCP server"
      transport: "streamable_http"
      url: "https://mcp.jina.ai/v1"

policy:
  allow_implicit_invocation: true
