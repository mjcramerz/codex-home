interface:
  display_name: Vercel React Best Practices
  short_description: React and Next.js performance optimization guidelines from Vercel
    Engineering. This skill should be used when writing, r
  default_prompt: 'Use the Vercel React Best Practices skill when the task matches
    this scope: React and Next.js performance optimization guidelines from Vercel
    Engineering. This skill should be used when writing, reviewing, or refactoring
    React/Next.js code to ensure optimal performance patterns. Triggers on tasks involving
    React components, Next.js pages, data fetching, bundle optimization, or performance
    improvements.'
dependencies:
  tools:
  - type: mcp
    value: context7
    description: context7 MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-context7-wrapper.sh
  - type: mcp
    value: fetch
    description: fetch MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-fetch-wrapper.sh
  - type: mcp
    value: filesystem
    description: filesystem MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-filesystem-wrapper.sh
  - type: mcp
    value: git
    description: git MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-git-wrapper.sh
  - type: mcp
    value: linear
    description: linear MCP server
    transport: streamable_http
    url: https://mcp.linear.app/mcp
  - type: mcp
    value: sequential_thinking
    description: sequential_thinking MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-sequential-thinking-wrapper.sh

policy:
  allow_implicit_invocation: true
