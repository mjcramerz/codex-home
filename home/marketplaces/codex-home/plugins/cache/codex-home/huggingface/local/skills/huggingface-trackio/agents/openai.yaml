interface:
  display_name: "Hugging Face Trackio"
  short_description: "Track and visualize ML training experiments with Trackio. Use when logging metrics during training (Python API), firing"
  default_prompt: "Use $huggingface-trackio. Use the Hugging Face Trackio skill when the task matches this scope: Track and visualize ML training experiments with Trackio. Use when logging metrics during training (Python API), firing alerts for training diagnostics, or retrieving/analyzing logged metrics (CLI). Supports real-time dashboard visualization, alerts with webhooks, HF Space syncing, and JSON output for automation."

dependencies:
  tools:
    - type: "mcp"
      value: "huggingface"
      description: "huggingface MCP server"
      transport: "streamable_http"
      url: "https://huggingface.co/mcp?login"

policy:
  allow_implicit_invocation: true
