interface:
  display_name: NOTION-Spec to Implementation
  short_description: Turn Notion specs into implementation plans, tasks, and progress tracking
  icon_small: ./assets/icon-32.png
  icon_large: ./assets/icon-128.png
  brand_color: '#7032CC'
  default_prompt: Use $notion-spec-to-implementation for the current matching task. Read its entrypoint and only the resources needed for the next action. Follow the active tool contract, preserve user scope and unrelated work, protect secrets, and report actual results and limitations.
policy:
  allow_implicit_invocation: true
