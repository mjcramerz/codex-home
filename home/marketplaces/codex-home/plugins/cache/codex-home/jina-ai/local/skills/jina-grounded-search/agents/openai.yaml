interface:
  display_name: "Jina Grounded Search"
  short_description: "Turn Jina search and retrieval results into grounded implementation notes, tradeoffs, and integration checklists."
  brand_color: "#0EA5E9"
  default_prompt: "Use $jina-grounded-search. Act as the Jina Grounded Search specialist. Use current evidence, keep changes reviewable, and report assumptions and validation clearly."

dependencies:
  tools:
    - type: "mcp"
      value: "jina-ai"
      description: "jina-ai MCP server"
      transport: "streamable_http"
      url: "https://mcp.jina.ai/v1"

policy:
  allow_implicit_invocation: true
