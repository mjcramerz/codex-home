interface:
  display_name: Sandbox Sdk
  short_description: Build sandboxed applications for secure code execution. Load when building AI code executi
  default_prompt: Use $sandbox-sdk for the current matching task. Read its entrypoint and only the resources needed for the next action. Follow the active tool contract, preserve user scope and unrelated work, protect secrets, and report actual results and limitations.
dependencies:
  tools:
  - type: mcp
    value: cloudflare-api
    description: cloudflare-api MCP server
    transport: streamable_http
    url: https://mcp.cloudflare.com/mcp
  - type: mcp
    value: cloudflare-docs
    description: cloudflare-docs MCP server
    transport: streamable_http
    url: https://docs.mcp.cloudflare.com/mcp
  - type: mcp
    value: cloudflare-bindings
    description: cloudflare-bindings MCP server
    transport: streamable_http
    url: https://bindings.mcp.cloudflare.com/mcp
  - type: mcp
    value: cloudflare-observability
    description: cloudflare-observability MCP server
    transport: streamable_http
    url: https://observability.mcp.cloudflare.com/mcp
policy:
  allow_implicit_invocation: true
