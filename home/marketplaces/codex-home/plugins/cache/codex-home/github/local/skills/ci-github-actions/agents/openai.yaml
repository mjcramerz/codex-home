interface:
  display_name: CI-GitHub Actions
  short_description: Harden GitHub Actions with deterministic, least-privilege defaults
  icon_small: ./assets/icon-32.png
  icon_large: ./assets/icon-128.png
  brand_color: '#3251CC'
  default_prompt: Use $ci-github-actions for the current matching task. Read its entrypoint and only the resources needed for the next action. Follow the active tool contract, preserve user scope and unrelated work, protect secrets, and report actual results and limitations.
policy:
  allow_implicit_invocation: true
