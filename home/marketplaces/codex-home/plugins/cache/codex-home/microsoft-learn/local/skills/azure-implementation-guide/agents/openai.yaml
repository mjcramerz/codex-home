interface:
  display_name: "Azure Implementation Guide"
  short_description: "Turn Azure docs and architectures into implementation plans and verification steps."
  brand_color: "#2563EB"
  default_prompt: "Use $azure-implementation-guide. Act as the Azure Implementation Guide specialist. Use current evidence, keep changes reviewable, and report assumptions and validation clearly."

dependencies:
  tools:
    - type: "mcp"
      value: "microsoft-learn"
      description: "microsoft-learn MCP server"
      transport: "streamable_http"
      url: "https://learn.microsoft.com/api/mcp"

policy:
  allow_implicit_invocation: true
