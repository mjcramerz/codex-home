interface:
  display_name: Building Ai Agent On Cloudflare
  short_description: Build Cloudflare Agents SDK apps with state, WebSockets, scheduled tasks, and tools
  default_prompt: Use $building-ai-agent-on-cloudflare for the current matching task. Read its entrypoint and only the resources needed for the next action. Follow the active tool contract, preserve user scope and unrelated work, protect secrets, and report actual results and limitations.
dependencies:
  tools:
  - type: mcp
    value: cloudflare-api
    description: cloudflare-api MCP server
    transport: streamable_http
    url: https://mcp.cloudflare.com/mcp
  - type: mcp
    value: cloudflare-docs
    description: cloudflare-docs MCP server
    transport: streamable_http
    url: https://docs.mcp.cloudflare.com/mcp
policy:
  allow_implicit_invocation: true
