interface:
  display_name: "Building Ai Agent On Cloudflare"
  short_description: "Build Cloudflare Agents SDK apps with state, WebSockets, scheduled tasks, and tools."
  default_prompt: "Use $building-ai-agent-on-cloudflare. Use the Building Ai Agent On Cloudflare skill when the task matches this scope: Builds AI agents on Cloudflare using the Agents SDK with state management,\nreal-time WebSockets, scheduled tasks, tool integration, and chat capabilities.\nGenerates production-ready agent code deployed to Workers.\nUse when: user wants to \"build an agent\", \"AI agent\", \"chat agent\", \"stateful\nagent\", mentions \"Agents SDK\", needs \"real-time AI\", \"WebSocket AI\", or asks\nabout agent \"state management\", \"scheduled tasks\", or \"tool calling\".\nBiases towards retrieval from Cloudflare docs over pre-trained knowledge."

dependencies:
  tools:
    - type: "mcp"
      value: "cloudflare-api"
      description: "cloudflare-api MCP server"
      transport: "streamable_http"
      url: "https://mcp.cloudflare.com/mcp"
    - type: "mcp"
      value: "cloudflare-docs"
      description: "cloudflare-docs MCP server"
      transport: "streamable_http"
      url: "https://docs.mcp.cloudflare.com/mcp"

policy:
  allow_implicit_invocation: true
