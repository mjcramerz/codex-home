interface:
  display_name: "WEB-SvelteKit"
  short_description: "Build SvelteKit apps with clear routing and adapters"
  icon_small: "./assets/icon-32.png"
  icon_large: "./assets/icon-128.png"
  brand_color: "#32CC59"
  default_prompt: "Use $web-sveltekit. Act as the \"WEB-SvelteKit\" specialist for \"Build SvelteKit apps with clear routing and adapters\". Deliver focused, deterministic results with minimal, reviewable changes and explicit assumptions. Validate untrusted inputs and bounded I/O, run the narrowest relevant checks, and report concrete actions, evidence, and residual risks."

dependencies:
  tools:
    - type: "mcp"
      value: "jina-ai"
      description: "jina-ai MCP server"
      transport: "streamable_http"
      url: "https://mcp.jina.ai/v1"

policy:
  allow_implicit_invocation: true
