interface:
  display_name: Runtime Config
  short_description: Inspect rendered config, instruction rewrites, and home sync behavior
  default_prompt: Use $runtime-config for the current matching task. Read its entrypoint and only the resources needed for the next action. Follow the active tool contract, preserve user scope and unrelated work, protect secrets, and report actual results and limitations.
dependencies:
  tools:
  - type: mcp
    value: openaiDeveloperDocs
    description: openaiDeveloperDocs MCP server
    transport: streamable_http
    url: https://developers.openai.com/mcp
policy:
  allow_implicit_invocation: true
