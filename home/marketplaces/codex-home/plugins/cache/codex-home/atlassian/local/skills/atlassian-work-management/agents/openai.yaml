interface:
  display_name: Atlassian Work Management
  short_description: Plan and review Jira- and Confluence-centered workflows, issue flows, and collaboration se
  brand_color: '#1D4ED8'
  default_prompt: Use $atlassian-work-management for the current matching task. Read its entrypoint and only the resources needed for the next action. Follow the active tool contract, preserve user scope and unrelated work, protect secrets, and report actual results and limitations.
dependencies:
  tools:
  - type: mcp
    value: atlassian
    description: atlassian MCP server
    transport: streamable_http
    url: https://mcp.atlassian.com/v1/mcp
policy:
  allow_implicit_invocation: true
