interface:
  display_name: Atlassian Cloud Implementation
  short_description: 'Turn Atlassian cloud documentation into auth, workflow, and implementation checklists for '
  brand_color: '#1D4ED8'
  default_prompt: Use $atlassian-cloud-implementation for the current matching task. Read its entrypoint and only the resources needed for the next action. Follow the active tool contract, preserve user scope and unrelated work, protect secrets, and report actual results and limitations.
dependencies:
  tools:
  - type: mcp
    value: atlassian
    description: atlassian MCP server
    transport: streamable_http
    url: https://mcp.atlassian.com/v1/mcp
policy:
  allow_implicit_invocation: true
