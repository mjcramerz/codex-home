interface:
  display_name: Hugging Face Model Trainer
  short_description: This skill should be used when users want to train or fine-tune
    language models using TRL (Transformer Reinforcement Lea
  default_prompt: 'Use the Hugging Face Model Trainer skill when the task matches
    this scope: This skill should be used when users want to train or fine-tune language
    models using TRL (Transformer Reinforcement Learning) on Hugging Face Jobs infrastructure.
    Covers SFT, DPO, GRPO and reward modeling training methods, plus GGUF conversion
    for local deployment. Includes guidance on the TRL Jobs package, UV scripts with
    PEP 723 format, dataset preparation and validation, hardware selection, cost estimation,
    Trackio monitoring, Hub authentication, and model persistence. Should be invoked
    for tasks involving cloud GPU training, GGUF conversion, or when users mention
    training on Hugging Face Jobs without local GPU setup.'
dependencies:
  tools:
  - type: mcp
    value: context7
    description: context7 MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-context7-wrapper.sh
  - type: mcp
    value: fetch
    description: fetch MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-fetch-wrapper.sh
  - type: mcp
    value: filesystem
    description: filesystem MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-filesystem-wrapper.sh
  - type: mcp
    value: git
    description: git MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-git-wrapper.sh
  - type: mcp
    value: linear
    description: linear MCP server
    transport: streamable_http
    url: https://mcp.linear.app/mcp
  - type: mcp
    value: sequential_thinking
    description: sequential_thinking MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-sequential-thinking-wrapper.sh
  - type: mcp
    value: huggingface
    description: huggingface MCP server
    transport: streamable_http
    url: https://huggingface.co/mcp?login

policy:
  allow_implicit_invocation: true
