interface:
  display_name: Hugging Face Evaluation
  short_description: Add and manage evaluation results in Hugging Face model cards.
    Supports extracting eval tables from README content, impo
  default_prompt: 'Use the Hugging Face Evaluation skill when the task matches this
    scope: Add and manage evaluation results in Hugging Face model cards. Supports
    extracting eval tables from README content, importing scores from Artificial Analysis
    API, and running custom model evaluations with vLLM/lighteval. Works with the
    model-index metadata format.'
dependencies:
  tools:
  - type: mcp
    value: context7
    description: context7 MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-context7-wrapper.sh
  - type: mcp
    value: fetch
    description: fetch MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-fetch-wrapper.sh
  - type: mcp
    value: filesystem
    description: filesystem MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-filesystem-wrapper.sh
  - type: mcp
    value: git
    description: git MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-git-wrapper.sh
  - type: mcp
    value: linear
    description: linear MCP server
    transport: streamable_http
    url: https://mcp.linear.app/mcp
  - type: mcp
    value: sequential_thinking
    description: sequential_thinking MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-sequential-thinking-wrapper.sh
  - type: mcp
    value: huggingface
    description: huggingface MCP server
    transport: streamable_http
    url: https://huggingface.co/mcp?login

policy:
  allow_implicit_invocation: true
