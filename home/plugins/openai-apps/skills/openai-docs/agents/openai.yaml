interface:
  display_name: OpenAI Docs
  short_description: Use this skill for reference the official OpenAI Developer docs
  icon_small: ./assets/openai-small.svg
  icon_large: ./assets/openai.png
  brand_color: '#10A37F'
  default_prompt: Use $openai-docs for the current matching task. Read its entrypoint and only the resources needed for the next action. Follow the active tool contract, preserve user scope and unrelated work, protect secrets, and report actual results and limitations.
dependencies:
  tools:
  - type: mcp
    value: openaiDeveloperDocs
    description: openaiDeveloperDocs MCP server
    transport: streamable_http
    url: https://developers.openai.com/mcp
policy:
  allow_implicit_invocation: true
