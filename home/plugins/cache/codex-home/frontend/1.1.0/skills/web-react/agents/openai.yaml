interface:
  display_name: "WEB-React"
  short_description: "Build React apps with performant component structure"
  icon_small: "./assets/icon-32.png"
  icon_large: "./assets/icon-128.png"
  brand_color: "#CC5632"
  default_prompt: "Use $web-react. Act as the \"WEB-React\" specialist for \"Build React apps with performant component structure\". Deliver focused, deterministic results with minimal, reviewable changes and explicit assumptions. Validate untrusted inputs and bounded I/O, run the narrowest relevant checks, and report concrete actions, evidence, and residual risks."

dependencies:
  tools:
    - type: "mcp"
      value: "jina-ai"
      description: "jina-ai MCP server"
      transport: "streamable_http"
      url: "https://mcp.jina.ai/v1"

policy:
  allow_implicit_invocation: true
