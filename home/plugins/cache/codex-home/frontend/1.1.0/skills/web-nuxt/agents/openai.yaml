interface:
  display_name: WEB-Nuxt
  short_description: Build Nuxt apps with explicit runtime config
  icon_small: ./assets/icon-32.png
  icon_large: ./assets/icon-128.png
  brand_color: '#32CC7C'
  default_prompt: Use $web-nuxt for the current matching task. Read its entrypoint and only the resources needed for the next action. Follow the active tool contract, preserve user scope and unrelated work, protect secrets, and report actual results and limitations.
dependencies:
  tools:
  - type: mcp
    value: jina-ai
    description: jina-ai MCP server
    transport: streamable_http
    url: https://mcp.jina.ai/v1
policy:
  allow_implicit_invocation: true
