interface:
  display_name: Hugging Face Datasets
  short_description: 'Create and manage datasets on Hugging Face Hub. Supports initializing
    repos, defining configs/system prompts, streaming '
  default_prompt: 'Use the Hugging Face Datasets skill when the task matches this
    scope: Create and manage datasets on Hugging Face Hub. Supports initializing repos,
    defining configs/system prompts, streaming row updates, and SQL-based dataset
    querying/transformation. Designed to work alongside HF MCP server for comprehensive
    dataset workflows.'
dependencies:
  tools:
  - type: mcp
    value: context7
    description: context7 MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-context7-wrapper.sh
  - type: mcp
    value: fetch
    description: fetch MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-fetch-wrapper.sh
  - type: mcp
    value: filesystem
    description: filesystem MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-filesystem-wrapper.sh
  - type: mcp
    value: git
    description: git MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-git-wrapper.sh
  - type: mcp
    value: linear
    description: linear MCP server
    transport: streamable_http
    url: https://mcp.linear.app/mcp
  - type: mcp
    value: sequential_thinking
    description: sequential_thinking MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-sequential-thinking-wrapper.sh
  - type: mcp
    value: huggingface
    description: huggingface MCP server
    transport: streamable_http
    url: https://huggingface.co/mcp?login

policy:
  allow_implicit_invocation: true
