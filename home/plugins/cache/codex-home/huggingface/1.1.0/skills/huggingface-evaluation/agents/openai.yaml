interface:
  display_name: "Hugging Face Evaluation"
  short_description: "Add and manage evaluation results in Hugging Face model cards. Supports extracting eval tables from README content, impo"
  default_prompt: "Use $huggingface-evaluation. Use the Hugging Face Evaluation skill when the task matches this scope: Add and manage evaluation results in Hugging Face model cards. Supports extracting eval tables from README content, importing scores from Artificial Analysis API, and running custom model evaluations with vLLM/lighteval. Works with the model-index metadata format."

dependencies:
  tools:
    - type: "mcp"
      value: "huggingface"
      description: "huggingface MCP server"
      transport: "streamable_http"
      url: "https://huggingface.co/mcp?login"

policy:
  allow_implicit_invocation: true
