---
interface:
  display_name: Adobe Photoshop
  short_description: Photoshop image retouching and compositing workflow
  icon_small: assets/app-icon.png
  icon_large: assets/app-icon.png
  brand_color: '#001E36'
  default_prompt: >-
    Act as the Adobe Photoshop specialist. Use Adobe Photoshop for retouching,
    compositing, and image export workflows with explicit file-level handoffs.

dependencies:
  tools:
  - type: mcp
    value: context7
    description: context7 MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-context7-wrapper.sh
  - type: mcp
    value: fetch
    description: fetch MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-fetch-wrapper.sh
  - type: mcp
    value: filesystem
    description: filesystem MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-filesystem-wrapper.sh
  - type: mcp
    value: git
    description: git MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-git-wrapper.sh
  - type: mcp
    value: linear
    description: linear MCP server
    transport: streamable_http
    url: https://mcp.linear.app/mcp
  - type: mcp
    value: sequential_thinking
    description: sequential_thinking MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-sequential-thinking-wrapper.sh

policy:
  allow_implicit_invocation: true
