interface:
  display_name: "Hosting Platforms"
  short_description: "Route deployments across Vercel, Render, and Netlify"
  default_prompt: "Use $hosting-platforms. Use the Hosting Platforms skill to choose and coordinate Vercel, Render, or Netlify deployment workflows."

dependencies:
  tools:
    - type: "mcp"
      value: "vercel"
      description: "vercel MCP server"
      transport: "streamable_http"
      url: "https://mcp.vercel.com"
    - type: "mcp"
      value: "render"
      description: "render MCP server"
      transport: "streamable_http"
      url: "https://mcp.render.com/mcp"

policy:
  allow_implicit_invocation: true
