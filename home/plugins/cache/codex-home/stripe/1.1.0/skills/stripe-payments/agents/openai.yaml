interface:
  display_name: "Stripe Payments"
  short_description: "Stripe payment flows, checkout, subscriptions, and webhooks"
  brand_color: "#635BFF"
  default_prompt: "Use $stripe-payments. Act as the Stripe Payments specialist. Use current evidence, keep changes reviewable, and report assumptions and validation clearly."

dependencies:
  tools:
    - type: "mcp"
      value: "stripe"
      description: "stripe MCP server"
      transport: "streamable_http"
      url: "https://mcp.stripe.com"

policy:
  allow_implicit_invocation: true
