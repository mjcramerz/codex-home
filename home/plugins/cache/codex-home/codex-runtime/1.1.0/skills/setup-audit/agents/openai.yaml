interface:
  display_name: "Setup Audit"
  short_description: "Audit installer behavior, rollout state, and verification coverage"
  default_prompt: "Use $setup-audit. Act as the Setup Audit specialist. Audit installer behavior, runtime rollout state, and verification commands with focused, reviewable findings."

dependencies:
  tools:
    - type: "mcp"
      value: "openaiDeveloperDocs"
      description: "openaiDeveloperDocs MCP server"
      transport: "streamable_http"
      url: "https://developers.openai.com/mcp"

policy:
  allow_implicit_invocation: true
