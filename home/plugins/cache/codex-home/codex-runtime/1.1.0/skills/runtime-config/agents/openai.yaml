interface:
  display_name: "Runtime Config"
  short_description: "Inspect rendered config, instruction rewrites, and home sync behavior"
  default_prompt: "Use $runtime-config. Act as the Runtime Config specialist. Inspect rendered config.toml, instruction path rewrites, and CODEX_HOME synchronization with concise, deterministic analysis."

dependencies:
  tools:
    - type: "mcp"
      value: "openaiDeveloperDocs"
      description: "openaiDeveloperDocs MCP server"
      transport: "streamable_http"
      url: "https://developers.openai.com/mcp"

policy:
  allow_implicit_invocation: true
