interface:
  display_name: "Schema Diff"
  short_description: "Compare checked-in config against upstream schema and release snapshots"
  default_prompt: "Use $schema-diff. Act as the Schema Diff specialist. Compare host config, repo templates, and upstream schema with file-backed evidence and clear missing-key analysis."

dependencies:
  tools:
    - type: "mcp"
      value: "openaiDeveloperDocs"
      description: "openaiDeveloperDocs MCP server"
      transport: "streamable_http"
      url: "https://developers.openai.com/mcp"

policy:
  allow_implicit_invocation: true
