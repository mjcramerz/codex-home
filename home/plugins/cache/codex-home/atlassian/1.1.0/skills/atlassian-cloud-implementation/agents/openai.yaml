interface:
  display_name: "Atlassian Cloud Implementation"
  short_description: "Turn Atlassian cloud documentation into auth, workflow, and implementation checklists for Jira and Confluence integrations."
  brand_color: "#1D4ED8"
  default_prompt: "Use $atlassian-cloud-implementation. Act as the Atlassian Cloud Implementation specialist. Use current evidence, keep changes reviewable, and report assumptions and validation clearly."

dependencies:
  tools:
    - type: "mcp"
      value: "atlassian"
      description: "atlassian MCP server"
      transport: "streamable_http"
      url: "https://mcp.atlassian.com/v1/mcp"

policy:
  allow_implicit_invocation: true
