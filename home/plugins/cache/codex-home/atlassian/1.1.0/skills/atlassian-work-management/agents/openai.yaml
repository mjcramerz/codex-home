interface:
  display_name: "Atlassian Work Management"
  short_description: "Plan and review Jira- and Confluence-centered workflows, issue flows, and collaboration setup using Atlassian guidance."
  brand_color: "#1D4ED8"
  default_prompt: "Use $atlassian-work-management. Act as the Atlassian Work Management specialist. Use current evidence, keep changes reviewable, and report assumptions and validation clearly."

dependencies:
  tools:
    - type: "mcp"
      value: "atlassian"
      description: "atlassian MCP server"
      transport: "streamable_http"
      url: "https://mcp.atlassian.com/v1/mcp"

policy:
  allow_implicit_invocation: true
