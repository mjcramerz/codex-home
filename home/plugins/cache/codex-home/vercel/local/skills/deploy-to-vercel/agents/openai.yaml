interface:
  display_name: Deploy To Vercel
  short_description: 'Deploy applications and websites to Vercel. Use when the user
    requests deployment actions like "deploy my app", "deploy '
  default_prompt: 'Use the Deploy To Vercel skill when the task matches this scope:
    Deploy applications and websites to Vercel. Use when the user requests deployment
    actions like "deploy my app", "deploy and give me the link", "push this live",
    or "create a preview deployment".'
dependencies:
  tools:
  - type: mcp
    value: context7
    description: context7 MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-context7-wrapper.sh
  - type: mcp
    value: fetch
    description: fetch MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-fetch-wrapper.sh
  - type: mcp
    value: filesystem
    description: filesystem MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-filesystem-wrapper.sh
  - type: mcp
    value: git
    description: git MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-git-wrapper.sh
  - type: mcp
    value: linear
    description: linear MCP server
    transport: streamable_http
    url: https://mcp.linear.app/mcp
  - type: mcp
    value: sequential_thinking
    description: sequential_thinking MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-sequential-thinking-wrapper.sh
  - type: mcp
    value: vercel
    description: vercel MCP server
    transport: streamable_http
    url: https://mcp.vercel.com

policy:
  allow_implicit_invocation: true
