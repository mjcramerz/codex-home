interface:
  display_name: Deploy To Vercel
  short_description: 'Deploy applications and websites to Vercel. Use when the user requests deployment actions '
  default_prompt: Use $deploy-to-vercel for the current matching task. Read its entrypoint and only the resources needed for the next action. Follow the active tool contract, preserve user scope and unrelated work, protect secrets, and report actual results and limitations.
dependencies:
  tools:
  - type: mcp
    value: vercel
    description: vercel MCP server
    transport: streamable_http
    url: https://mcp.vercel.com
policy:
  allow_implicit_invocation: true
