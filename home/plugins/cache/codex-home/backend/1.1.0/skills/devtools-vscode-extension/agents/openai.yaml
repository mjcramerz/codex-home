interface:
  display_name: "DEVTOOLS-VS Code Extension"
  short_description: "Develop VS Code extensions with secure defaults, packaging, and tests"
  icon_small: "./assets/icon-32.png"
  icon_large: "./assets/icon-128.png"
  brand_color: "#8E32CC"
  default_prompt: "Use $devtools-vscode-extension. Act as the \"DEVTOOLS-VS Code Extension\" specialist for \"Develop VS Code extensions with secure defaults, packaging, and tests\". Deliver focused, deterministic results with minimal, reviewable changes and explicit assumptions. Validate untrusted inputs and bounded I/O, run the narrowest relevant checks, and report concrete actions, evidence, and residual risks."

dependencies:
  tools:
    - type: "mcp"
      value: "microsoft-learn"
      description: "microsoft-learn MCP server"
      transport: "streamable_http"
      url: "https://learn.microsoft.com/api/mcp"

policy:
  allow_implicit_invocation: true
