interface:
  display_name: DEVTOOLS-VS Code Extension
  short_description: Develop VS Code extensions with secure defaults, packaging, and tests
  icon_small: assets/icon-32.png
  icon_large: assets/icon-128.png
  brand_color: '#8E32CC'
  default_prompt: Act as the "DEVTOOLS-VS Code Extension" specialist for "Develop VS Code extensions with
    secure defaults, packaging, and tests". Deliver focused, deterministic results with minimal, reviewable
    changes and explicit assumptions. Validate untrusted inputs and bounded I/O, run the narrowest relevant
    checks, and report concrete actions, evidence, and residual risks.

dependencies:
  tools:
  - type: mcp
    value: context7
    description: context7 MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-context7-wrapper.sh
  - type: mcp
    value: fetch
    description: fetch MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-fetch-wrapper.sh
  - type: mcp
    value: filesystem
    description: filesystem MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-filesystem-wrapper.sh
  - type: mcp
    value: git
    description: git MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-git-wrapper.sh
  - type: mcp
    value: linear
    description: linear MCP server
    transport: streamable_http
    url: https://mcp.linear.app/mcp
  - type: mcp
    value: sequential_thinking
    description: sequential_thinking MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-sequential-thinking-wrapper.sh
  - type: mcp
    value: microsoft-learn
    description: microsoft-learn MCP server
    transport: streamable_http
    url: https://learn.microsoft.com/api/mcp

policy:
  allow_implicit_invocation: true
