interface:
  display_name: "Web Perf"
  short_description: "Analyzes web performance using Chrome DevTools MCP. Measures Core Web Vitals (FCP, LCP, TBT, CLS, Speed Index), identifi"
  default_prompt: "Use $web-perf. Use the Web Perf skill when the task matches this scope: Analyzes web performance using Chrome DevTools MCP. Measures Core Web Vitals (FCP, LCP, TBT, CLS, Speed Index), identifies render-blocking resources, network dependency chains, layout shifts, caching issues, and accessibility gaps. Use when asked to audit, profile, debug, or optimize page load performance, Lighthouse scores, or site speed. Biases towards retrieval from current documentation over pre-trained knowledge."

dependencies:
  tools:
    - type: "mcp"
      value: "cloudflare-api"
      description: "cloudflare-api MCP server"
      transport: "streamable_http"
      url: "https://mcp.cloudflare.com/mcp"
    - type: "mcp"
      value: "cloudflare-docs"
      description: "cloudflare-docs MCP server"
      transport: "streamable_http"
      url: "https://docs.mcp.cloudflare.com/mcp"
    - type: "mcp"
      value: "cloudflare-bindings"
      description: "cloudflare-bindings MCP server"
      transport: "streamable_http"
      url: "https://bindings.mcp.cloudflare.com/mcp"
    - type: "mcp"
      value: "cloudflare-observability"
      description: "cloudflare-observability MCP server"
      transport: "streamable_http"
      url: "https://observability.mcp.cloudflare.com/mcp"

policy:
  allow_implicit_invocation: true
