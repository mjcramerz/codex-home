interface:
  display_name: "Cloudflare R2"
  short_description: "R2 bucket, prefix, and publication-front-end contracts"
  icon_small: "./assets/icon-32.png"
  icon_large: "./assets/icon-128.png"
  brand_color: "#F97316"
  default_prompt: "Use $cloudflare-r2. Act as the \"Cloudflare R2\" specialist for \"R2 bucket, prefix, and publication-front-end contracts\". Deliver focused, deterministic results with minimal, reviewable changes and explicit assumptions. Validate untrusted inputs and bounded I/O, run the narrowest relevant checks, and report concrete actions, evidence, and residual risks."

dependencies:
  tools:
    - type: "mcp"
      value: "cloudflare-api"
      description: "cloudflare-api MCP server"
      transport: "streamable_http"
      url: "https://mcp.cloudflare.com/mcp"
    - type: "mcp"
      value: "cloudflare-docs"
      description: "cloudflare-docs MCP server"
      transport: "streamable_http"
      url: "https://docs.mcp.cloudflare.com/mcp"
    - type: "mcp"
      value: "cloudflare-bindings"
      description: "cloudflare-bindings MCP server"
      transport: "streamable_http"
      url: "https://bindings.mcp.cloudflare.com/mcp"
    - type: "mcp"
      value: "cloudflare-observability"
      description: "cloudflare-observability MCP server"
      transport: "streamable_http"
      url: "https://observability.mcp.cloudflare.com/mcp"

policy:
  allow_implicit_invocation: true
