interface:
  display_name: Building Mcp Server On Cloudflare
  short_description: 'Builds remote MCP (Model Context Protocol) servers on Cloudflare
    Workers

    with tools, OAuth authentication, and productio'
  default_prompt: 'Use the Building Mcp Server On Cloudflare skill when the task matches
    this scope: Builds remote MCP (Model Context Protocol) servers on Cloudflare Workers

    with tools, OAuth authentication, and production deployment. Generates

    server code, configures auth providers, and deploys to Workers.

    Use when: user wants to "build MCP server", "create MCP tools", "remote

    MCP", "deploy MCP", add "OAuth to MCP", or mentions Model Context Protocol

    on Cloudflare. Also triggers on "MCP authentication" or "MCP deployment".

    Biases towards retrieval from Cloudflare docs over pre-trained knowledge.'
dependencies:
  tools:
  - type: mcp
    value: context7
    description: context7 MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-context7-wrapper.sh
  - type: mcp
    value: fetch
    description: fetch MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-fetch-wrapper.sh
  - type: mcp
    value: filesystem
    description: filesystem MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-filesystem-wrapper.sh
  - type: mcp
    value: git
    description: git MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-git-wrapper.sh
  - type: mcp
    value: linear
    description: linear MCP server
    transport: streamable_http
    url: https://mcp.linear.app/mcp
  - type: mcp
    value: sequential_thinking
    description: sequential_thinking MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-sequential-thinking-wrapper.sh
  - type: mcp
    value: cloudflare-api
    description: cloudflare-api MCP server
    transport: streamable_http
    url: https://mcp.cloudflare.com/mcp
  - type: mcp
    value: cloudflare-docs
    description: cloudflare-docs MCP server
    transport: streamable_http
    url: https://docs.mcp.cloudflare.com/mcp

policy:
  allow_implicit_invocation: true
