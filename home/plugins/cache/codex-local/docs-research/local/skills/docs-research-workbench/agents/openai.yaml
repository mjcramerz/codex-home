---
interface:
  display_name: Docs Research Workbench
  short_description: >-
    Compare official docs and turn findings into engineering decisions
  brand_color: '#0EA5E9'
  default_prompt: >-
    Act as the Docs Research Workbench specialist. Use current evidence,
    keep changes reviewable, and report assumptions and validation
    clearly.

dependencies:
  tools:
  - type: mcp
    value: context7
    description: context7 MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-context7-wrapper.sh
  - type: mcp
    value: fetch
    description: fetch MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-fetch-wrapper.sh
  - type: mcp
    value: filesystem
    description: filesystem MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-filesystem-wrapper.sh
  - type: mcp
    value: git
    description: git MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-git-wrapper.sh
  - type: mcp
    value: linear
    description: linear MCP server
    transport: streamable_http
    url: https://mcp.linear.app/mcp
  - type: mcp
    value: sequential_thinking
    description: sequential_thinking MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-sequential-thinking-wrapper.sh
  - type: mcp
    value: openaiDeveloperDocs
    description: openaiDeveloperDocs MCP server
    transport: streamable_http
    url: https://developers.openai.com/mcp
  - type: mcp
    value: microsoft-learn
    description: microsoft-learn MCP server
    transport: streamable_http
    url: https://learn.microsoft.com/api/mcp
  - type: mcp
    value: jina-ai
    description: jina-ai MCP server
    transport: streamable_http
    url: https://mcp.jina.ai/v1

policy:
  allow_implicit_invocation: true
