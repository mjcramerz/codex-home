interface:
  display_name: Vercel Composition Patterns
  short_description: React composition patterns that scale. Use when refactoring components
    with boolean prop proliferation, building flexibl
  default_prompt: 'Use the Vercel Composition Patterns skill when the task matches
    this scope: React composition patterns that scale. Use when refactoring components
    with boolean prop proliferation, building flexible component libraries, or designing
    reusable APIs. Triggers on tasks involving compound components, render props,
    context providers, or component architecture. Includes React 19 API changes.'
dependencies:
  tools:
  - type: mcp
    value: context7
    description: context7 MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-context7-wrapper.sh
  - type: mcp
    value: fetch
    description: fetch MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-fetch-wrapper.sh
  - type: mcp
    value: filesystem
    description: filesystem MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-filesystem-wrapper.sh
  - type: mcp
    value: git
    description: git MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-git-wrapper.sh
  - type: mcp
    value: linear
    description: linear MCP server
    transport: streamable_http
    url: https://mcp.linear.app/mcp
  - type: mcp
    value: sequential_thinking
    description: sequential_thinking MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-sequential-thinking-wrapper.sh

policy:
  allow_implicit_invocation: true
