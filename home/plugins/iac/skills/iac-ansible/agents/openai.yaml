interface:
  display_name: IAC-Ansible
  short_description: Build idempotent Ansible playbooks and roles safely
  icon_small: ./assets/icon-32.png
  icon_large: ./assets/icon-128.png
  brand_color: '#32CC49'
  default_prompt: Use $iac-ansible for the current matching task. Read its entrypoint and only the resources needed for the next action. Follow the active tool contract, preserve user scope and unrelated work, protect secrets, and report actual results and limitations.
policy:
  allow_implicit_invocation: true
