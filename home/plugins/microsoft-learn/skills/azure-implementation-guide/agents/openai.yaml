interface:
  display_name: Azure Implementation Guide
  short_description: Turn Azure docs and architectures into implementation plans and verification steps
  brand_color: '#2563EB'
  default_prompt: Use $azure-implementation-guide for the current matching task. Read its entrypoint and only the resources needed for the next action. Follow the active tool contract, preserve user scope and unrelated work, protect secrets, and report actual results and limitations.
dependencies:
  tools:
  - type: mcp
    value: microsoft-learn
    description: microsoft-learn MCP server
    transport: streamable_http
    url: https://learn.microsoft.com/api/mcp
policy:
  allow_implicit_invocation: true
