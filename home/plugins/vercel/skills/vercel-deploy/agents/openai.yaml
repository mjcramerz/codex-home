interface:
  display_name: Vercel Deploy
  short_description: Deploy apps and agents with zero configuration on Vercel. No account required
  icon_small: ./assets/vercel-small.svg
  icon_large: ./assets/vercel.png
  default_prompt: Use $vercel-deploy for the current matching task. Read its entrypoint and only the resources needed for the next action. Follow the active tool contract, preserve user scope and unrelated work, protect secrets, and report actual results and limitations.
dependencies:
  tools:
  - type: mcp
    value: vercel
    description: vercel MCP server
    transport: streamable_http
    url: https://mcp.vercel.com
