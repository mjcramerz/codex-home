interface:
  display_name: WEB-HTMX
  short_description: Build server-driven HTMX pages with minimal JS
  icon_small: ./assets/icon-32.png
  icon_large: ./assets/icon-128.png
  brand_color: '#CC6D32'
  default_prompt: Use $web-htmx for the current matching task. Read its entrypoint and only the resources needed for the next action. Follow the active tool contract, preserve user scope and unrelated work, protect secrets, and report actual results and limitations.
dependencies:
  tools:
  - type: mcp
    value: jina-ai
    description: jina-ai MCP server
    transport: streamable_http
    url: https://mcp.jina.ai/v1
policy:
  allow_implicit_invocation: true
