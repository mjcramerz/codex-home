# Use this manifest to preserve compatibility entrypoints; hooks.json is the active registration.
version = 1

[singleton_events.SessionStart]
script = "session_start.pl"
timeout = 5

[singleton_events.SessionEnd]
script = "session_end.pl"
timeout = 3

[singleton_events.UserPromptSubmit]
script = "user_prompt_submit.pl"
timeout = 5

[singleton_events.PreToolUse]
script = "pre_tool_use.pl"
timeout = 5

[singleton_events.PermissionRequest]
script = "permission_request.pl"
timeout = 5

[singleton_events.PostToolUse]
script = "post_tool_use.pl"
timeout = 5

[singleton_events.PreCompact]
script = "pre_compact.pl"
timeout = 5

[singleton_events.PostCompact]
script = "post_compact.pl"
timeout = 5

[singleton_events.SubagentStart]
script = "subagent_start.pl"
timeout = 5

[singleton_events.SubagentStop]
script = "subagent_stop.pl"
timeout = 5

[singleton_events.Stop]
script = "stop.pl"
timeout = 5

[singleton_events.Interrupt]
script = "interrupt.pl"
timeout = 5
