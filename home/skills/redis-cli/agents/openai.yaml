interface:
  display_name: DB-Redis CLI
  short_description: Operate Redis safely from the redis-cli shell
  icon_small: ./assets/icon-32.png
  icon_large: ./assets/icon-128.png
  brand_color: '#DC2626'
  default_prompt: Use $redis-cli for the current matching task. Read its entrypoint and only the resources needed for the next action. Follow the active tool contract, preserve user scope and unrelated work, protect secrets, and report actual results and limitations.
policy:
  allow_implicit_invocation: true
