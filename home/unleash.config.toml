# Explicitly insecure Codex policy: codex --profile unleash.
# Host permissions, the managed wrapper and remote-service auth still apply.
# Switching to legacy empty filters removes the inherited filter table.
model_provider = "openai-custom"
default_permissions = ":danger-full-access"
approval_policy = "never"
approvals_reviewer = "user"
allow_login_shell = true
allow_symlinked_codex_home = true
web_search = "live"

[features]
guardian_approval = false
hooks = false
exec_permission_approvals = false
write_stdin_approval = false
request_permissions_tool = false

[features.network_proxy]
enabled = false

[features.guardianv2]
enabled = false

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = true
exclude = []
include_only = []
experimental_use_profile = true

[apps]

[apps._default]
enabled = true
approvals_reviewer = "user"
default_tools_approval_mode = "approve"
destructive_enabled = true
open_world_enabled = true

[browser_use]
allow_history_access = true

[browser_use.default_origin_policy]
access = "allow"
downloads = "allow"
uploads = "allow"
full_cdp_access = "allow"

[computer_use]
default_app_access = "allow"

[notice]
hide_full_access_warning = true

