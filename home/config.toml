enabled = true
default_wait_timeout_ms = 30000
expose_spawn_agent_model_overrides = true
hide_spawn_agent_metadata = false
max_concurrent_threads_per_session = 4
max_wait_timeout_ms = 3600000
min_wait_timeout_ms = 10000
multi_agent_mode_hint_text = "Use multiple agents only for independent, bounded work with explicit ownership and validation."
non_code_mode_only = false
root_agent_usage_hint_text = "Delegate independent sidecar tasks while keeping the critical path and final integration with the root agent."
subagent_developer_instructions = "Complete only the assigned bounded subtask, do not widen scope, validate your result, and return concrete evidence to the root agent."
subagent_usage_hint_text = "Stay within the assigned files and stop when the requested evidence or patch is complete."
tool_namespace = "agents"
usage_hint_text = "Use agents for independent work; keep one coordinator responsible for integration."
wait_agent_enabled = true

[features.network_proxy]
enabled = false
proxy_url = "http://127.0.0.1:8080"
enable_socks5 = true
socks_url = "socks5://127.0.0.1:1080"
enable_socks5_udp = false
allow_upstream_proxy = true
dangerously_allow_non_loopback_proxy = false
dangerously_allow_all_unix_sockets = false
mode = "full"
allow_local_binding = true
credential_broker = false

[features.network_proxy.domains]
"*" = "allow"

[features.network_proxy.unix_sockets]

# Keep the Codex command proxy disabled for direct outbound networking.
# With enabled=false, profile domains and metadata-deny rules are NOT enforced by this proxy.
# Enable the proxy only when explicitly selecting mediated traffic; keep loopback listeners.
# Host firewalls, DNS, credentials, managed requirements and upstream proxy policy still apply.
[features.non_prefixed_mcp_tool_names]
enabled = false
server_names = []

[features.rollout_budget]
enabled = true
limit_tokens = 900000
prefill_token_weight = 1.0
sampling_token_weight = 1.0
reminder_at_remaining_tokens = [200000, 100000, 50000]

[features.token_budget]
enabled = true
auto_compact_fallback_buffer_tokens = 25000
auto_compact_fallback_prompt = "Context is approaching automatic compaction. Preserve critical decisions, constraints, unfinished work, and exact validation evidence before rollover."
guidance_message = "Track remaining context, keep tool output bounded, and preserve the critical path before automatic compaction."
reminder_message_template = "Approximately {n_remaining} tokens remain before automatic compaction. Consolidate decisions, evidence, and the next concrete action."
reminder_threshold_tokens = 100000
use_history_notes_extension = false

[features.tool_registry]
error_on_tool_collisions = true
turn_metadata_includes_tool_info = true

[features.context_management]
experimental_mode = false
# Leave experimental context replacement off unless the selected client explicitly requires it.

[features.sleep_tool]
enabled = true
mode = "model_driven"
# Use canonical names for new settings. Existing removed names are retained for this supplied client.
# Do not infer that an enabled flag supplies an installed tool or backend capability.
# The desktop requirements-only gates belong to managed requirements, not effective user feature overrides.
# Do not invent user-level effects for in_app_chat or in_app_dictation retained above.
[memories]
disable_on_external_context = false
generate_memories = true
use_memories = true
dedicated_tools = true
max_raw_memories_for_consolidation = 15
max_unused_days = 15
max_rollout_age_days = 2
max_rollouts_per_startup = 20
min_rollout_idle_hours = 5
min_rate_limit_remaining_percent = 25
extract_model = "gpt-5.6-terra"
consolidation_model = "gpt-5.6-terra"

[apps]

[apps._default]
enabled = true
approvals_reviewer = "user"
default_tools_approval_mode = "auto"
destructive_enabled = true
open_world_enabled = true

