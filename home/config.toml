# Use * for all public vendors, Git hosts, registries, mirrors and self-hosted names.
# Keep explicit metadata-deny entries for future mediated mode; they are inactive while the command proxy is disabled.
# Treat a destination permission as connectivity, never as permission to send private data.
[permissions.workspace.network.unix_sockets]
"/data/codex/sockets/codex-mcp.sock" = "allow"

[permissions.workspace.network.mitm]
[permissions.workspace.network.mitm.actions]

[permissions.workspace.network.mitm.hooks]
[permissions.readonly]
description = "Use read-only local access with broad outbound networking; network access does not make remote writes read-only."

[permissions.readonly.filesystem]
":minimal" = "read"
":tmpdir" = "read"
"/data/codex/share/bin" = "read"
"/data/codex/share/helpers" = "read"
"/data/bin" = "read"
"/data/codex/mcp" = "read"
"/data/codex/usr/agents" = "read"
"/data/codex/usr/skills" = "read"
"/data/codex/usr/instructions" = "read"
"/data/codex/usr/home/memories" = "read"
"/data/codex/usr/home/sessions" = "read"
"/data/codex/usr/home/shell_snapshots" = "read"
glob_scan_max_depth = 8

[permissions.readonly.filesystem.":project_roots"]
"." = "read"
".mcr" = "read"
docs = "read"
patches = "read"

[permissions.readonly.network]
enabled = true
mode = "full"
proxy_url = "http://127.0.0.1:8080"
socks_url = "socks5://127.0.0.1:1080"
enable_socks5 = false
enable_socks5_udp = false
allow_upstream_proxy = true
dangerously_allow_non_loopback_proxy = false
dangerously_allow_all_unix_sockets = false
allow_local_binding = false

