# Use * for all public vendors, Git hosts, registries, mirrors and self-hosted names.
# Keep explicit metadata-deny entries for future mediated mode; they are inactive while the command proxy is disabled.
# Treat a destination permission as connectivity, never as permission to send private data.
[permissions.readonly.network.unix_sockets]
"/data/codex/sockets/codex-mcp.sock" = "allow"

# App-owned preferences are preserved recursively during installation.

[permissions.readonly.network.mitm]
[permissions.readonly.network.mitm.actions]

[permissions.readonly.network.mitm.hooks]
[desktop]
[desktop.custom_file_handlers.debian-default]
command = "/usr/bin/xdg-open"
args = []
label = "Debian default application"
icon = "/data/codex/usr/home/skills/repo-ops/assets/icon-128.png"
input = "path"
supports_ssh = false
# Use only documented desktop keys. The CLI treats this table as opaque app configuration.
# Verify the app supports custom_file_handlers and the executable/icon exist on the target host.
# Do not infer that the desktop app itself supports Debian from this optional handler declaration.

[browser_use]
allow_history_access = false

[browser_use.default_origin_policy]
access = "allow"
downloads = "allow"
uploads = "allow"
full_cdp_access = "deny"

[browser_use.origins]

[computer_use]
default_app_access = "deny"

[computer_use.macos.bundle_ids]

[computer_use.windows]
exes = []

[computer_use.windows.aumids]
# Do not grant desktop-control authority merely to make a table nonempty.
# Select actual app rules only for an authorized computer-use task; Linux CLI access is independent.

[tool_suggest]
discoverables = []
disabled_tools = []

[hooks]
Interrupt = []
PermissionRequest = []
PostCompact = []
PostToolUse = []
PreCompact = []
PreToolUse = []
SessionEnd = []
SessionStart = []
Stop = []
SubagentStart = []
SubagentStop = []
UserPromptSubmit = []

[hooks.state]
# Keep inline event arrays empty: hooks.json owns the active handlers.
# Do not register the same handler here and in hooks.json.
# Let Codex manage per-hook state IDs and trusted_hash values; never fabricate trust hashes.

[projects]
# Add only a verified absolute project path and its explicit trust_level. Do not trust / or an arbitrary checkout.

[responses_api_metadata]
# Keep product-owned metadata empty unless the target client supplies an explicit non-secret contract.

[profiles]
[profiles.fast]
model_reasoning_effort = "medium"
model_verbosity = "medium"
web_search = "live"

[profiles.review]
model_reasoning_effort = "high"
model_verbosity = "medium"
web_search = "live"

[profiles.debug]
model_reasoning_effort = "high"
model_verbosity = "medium"
web_search = "live"

[profiles.cyber]
model_reasoning_effort = "high"
model_verbosity = "medium"
web_search = "live"

[profiles.test]
model_reasoning_effort = "high"
model_verbosity = "medium"
web_search = "live"
# Select a profile explicitly when its tradeoff matches the task. Profiles do not bypass the selected permission policy.

# CONDITIONAL CONFIGURATION SHAPES -- read only for the relevant configuration task.
# Check the selected release before enabling any of these alternatives. Placeholder
# values are not live credentials, valid resource IDs, registered hooks or installed tools.
# Use the existing live table for a matching entry; never append a duplicate table.
# Sources:
# https://developers.openai.com/codex/config-reference
# https://developers.openai.com/codex/permissions
# https://developers.openai.com/codex/hooks
# https://raw.githubusercontent.com/openai/codex/rust-v0.154.0/codex-rs/core/config.schema.json
# https://raw.githubusercontent.com/openai/codex/rust-v0.154.0/codex-rs/features/src/lib.rs
#
# [experimental_thread_store]
# type = "local"
#
# Old permission syntax is an ALTERNATIVE in an isolated older-client config,
# never additional active keys beside default_permissions:
# sandbox_mode = "danger-full-access"  # root key; place before all tables
# [sandbox_workspace_write]
# network_access = true
# writable_roots = ["/absolute/authorized/workspace"]
# exclude_tmpdir_env_var = false
# exclude_slash_tmp = false
#
# [projects."/absolute/verified/repository"]
# trust_level = "trusted"
#
# Provider auth is an alternative to env_key/OpenAI login, not an extra auth source:
# [model_providers."provider".auth]
# command = "/absolute/trusted/token-helper"
# args = []
# cwd = "/absolute/trusted/working-directory"
# timeout_ms = 5000
# refresh_interval_ms = 300000
# [model_providers."provider".aws]
# profile = "<existing-aws-profile>"
# region = "<authorized-aws-region>"
# [model_providers."provider".aws.auth_refresh]
# command = "/absolute/trusted/aws-auth-helper"
# args = []
# timeout_ms = 300000
# model_providers.<provider>.experimental_bearer_token is supported but must not
# store a secret in this shared file; prefer env_key or command-backed authentication.
#
# HTTP-only MCP additions; never combine url transport with command transport:
# [mcp_servers."http-server"]
# url = "https://<authorized-mcp-host>/mcp"
# bearer_token_env_var = "<existing-secret-environment-variable-name>"
# http_headers_helper = "/absolute/trusted/header-helper"
# oauth_resource = "<registered-resource-identifier>"
# scopes = ["<required-oauth-scope>"]
# enabled_tools = ["<actual-discovered-tool-name>"]  # [] would hide every tool
# environment_id = "<actual-runtime-environment-id>"
# [mcp_servers."http-server".oauth]
# callback_port = 8088
# callback_url = "http://127.0.0.1:8088/callback"
# client_id = "<registered-oauth-client-id>"
# [mcp_servers."server".tools."actual-tool-name"]
# approval_mode = "auto"
# output_token_limit = 20000
#
# stdio-only MCP additions; keep argument boundaries and never place secrets in args:
# [mcp_servers."stdio-server"]
# command = "/absolute/trusted/server"
# args = []
# cwd = "/absolute/authorized/working-directory"
# env_vars = ["EXISTING_ENV_NAME", { name = "TARGET_ENV_NAME", source = "SOURCE_ENV_NAME" }]
# startup_timeout_ms = 20000  # alternative to startup_timeout_sec; do not set both
# supports_parallel_tool_calls = false
# [mcp_servers."stdio-server".env]
# NON_SECRET_SETTING = "value"
#
# Per-app policy needs a real connected app ID and tool names:
# [apps."app-id"]
# enabled = true
# approvals_reviewer = "user"
# default_tools_approval_mode = "auto"
# destructive_enabled = true
# open_world_enabled = true
# [apps."app-id".tools."tool-name"]
# enabled = true
# approval_mode = "prompt"
#
# [[skills.config]]
# name = "<actual-discovered-skill-name>"  # choose name OR path selector
# enabled = true
#
# [plugins."plugin@marketplace"]
# enabled = true
# [marketplaces."marketplace"]
# source_type = "git"
# source = "https://<verified-host>/<organization>/<repository>.git"
# ref = "<reviewed-ref>"
# sparse_paths = ["<actual-plugin-subtree>"]
#
# [browser_use.origins."https://authorized-origin.example"]
# access = "allow"
# downloads = "allow"
# uploads = "allow"
# full_cdp_access = "deny"
# [computer_use.macos.bundle_ids]
# "<actual-bundle-id>" = "allow"
# [computer_use.windows.aumids]
# "<actual-aumid>" = "allow"
# [[computer_use.windows.exes]]
# publisher_name = "<verified-publisher>"
# product_name = "<verified-product>"
# binary_name = "<verified-binary>"
# access = "allow"
#
# [hooks.state."Codex-generated-hook-id"]
# enabled = true
# trusted_hash = "<hash-approved-by-Codex-after-review>"
# An inline command handler is an ALTERNATIVE to the same registration in hooks.json:
# [[hooks.SessionStart]]
# matcher = "startup|resume|clear|compact"
# [[hooks.SessionStart.hooks]]
# type = "command"
# command = '/usr/bin/python3 -I "$CODEX_HOME/.hooks/runner.py" --event SessionStart --timeout 3'
# timeout = 5
# statusMessage = "Read bounded repository context"
# additionalContextLimit = 2000
# An MCP hook must use type="mcp_tool", server=<configured server>, tool=<actual tool>,
# input=<JSON-compatible table>, timeout=<seconds>, and optional statusMessage.
# Prompt and agent handler types are reserved upstream; do not invent implementations.
#
# [[tool_suggest.discoverables]]
# type = "plugin"
# id = "<actual-discoverable-plugin-id>"
# [[tool_suggest.disabled_tools]]
# type = "connector"
# id = "<actual-connector-id>"
#
# Exporter tables REPLACE the corresponding exporter="none" scalar; never use both.
# [otel.exporter.otlp-http]
# endpoint = "https://<approved-collector>/v1/logs"
# protocol = "binary"
# headers = {}  # do not store authentication secrets here
# [otel.exporter.otlp-http.tls]
# ca-certificate = "/absolute/trusted/ca.pem"
# client-certificate = "/absolute/trusted/client.pem"
# client-private-key = "/absolute/protected/client-key.pem"
# [otel.trace_exporter.otlp-grpc]
# endpoint = "https://<approved-collector>:4317"
# headers = {}
# [otel.trace_exporter.otlp-grpc.tls]
# ca-certificate = "/absolute/trusted/ca.pem"
# client-certificate = "/absolute/trusted/client.pem"
# client-private-key = "/absolute/protected/client-key.pem"
# metrics_exporter accepts the same none/otlp-http/otlp-grpc alternatives.
# Keep log_user_prompt=false and tool_result.max_bytes=0 for private task content.

# Optional plugin-contributed MCP policy; manifests own the transport:
# [plugins."plugin@marketplace".mcp_servers."actual-server"]
# enabled = true
# default_tools_approval_mode = "auto"
# disabled_tools = []
# enabled_tools = ["actual-tool"]  # omit to retain all discovered tools
# [plugins."plugin@marketplace".mcp_servers."actual-server".tools."actual-tool"]
# approval_mode = "prompt"
# output_token_limit = 20000
#
# Optional MITM rules require an explicitly authorized managed proxy. Do not
# enable credential injection merely to reach a vendor; the normal network is direct.
# [permissions."profile-id".network.mitm.actions."scoped-auth"]
# strip_request_headers = ["authorization"]
# [[permissions."profile-id".network.mitm.actions."scoped-auth".inject_request_headers]]
# name = "Authorization"
# prefix = "Bearer "
# secret_env_var = "EXISTING_SECRET_ENV_NAME"
# secret_file is an alternative absolute protected path; never set both sources.
# [permissions."profile-id".network.mitm.hooks."scoped-endpoint"]
# host = "api.authorized-vendor.example"
# methods = ["GET"]
# path_prefixes = ["/v1/authorized-resource"]
# action = ["scoped-auth"]
# headers = {}
# query = {}
# body = {}  # omit unless a reviewed body predicate is required

# Desktop-app-only saved approvals in the current public reference; older CLI
# schemas do not enumerate this field. Use only with an app version that owns it.
# [computer_use.windows]
# always_allowed_app_ids = []  # never invent or pre-approve application identifiers
