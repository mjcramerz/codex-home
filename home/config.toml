NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = "Control the Chrome browser in conjunction with the Chrome Plugin. Prefer this method of controlling Chrome over alternatives (such as Computer Use) unless the user explicitly mentions an alternative."
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
NODE_REPL_TRUSTED_SERVICES = "{\"browser\":\"/data/codex/usr/home/plugins/cache/openai-bundled/browser/26.825.41651/scripts/browser-service.mjs\"}"
CODEX_CLI_PATH = "/usr/lib/chatgpt/resources/codex"
NODE_REPL_LAUNCHER = "/usr/lib/chatgpt/resources/cua_node/bin/node_repl"

[mcp_servers.node_repl.tools]
[mcp_servers.cua_repl]
command = "/usr/lib/chatgpt/ChatGPT"
enabled = false
disabled_tools = []
omit_tools_from = []
env_vars = []

[mcp_servers.cua_repl.tools]

[mcp_servers.cua_repl.env]
[marketplaces]

[marketplaces.codex-home]
source_type = "local"
source = "/data/codex/usr/home/marketplaces/codex-home"

[marketplaces.repo-local]
source_type = "local"
source = "/data/codex/usr/home/marketplaces/repo-local"

[marketplaces.openai-curated]
source_type = "git"
source = "https://github.com/openai/plugins"
ref = "main"
sparse_paths = [".agents", "plugins"]

[marketplaces.openai-bundled]
source_type = "local"
source = "/data/codex/usr/home/.tmp/bundled-marketplaces/openai-bundled"

[approval_policy]

# True permits the corresponding prompt category; it does not auto-approve it.
[approval_policy.granular]
mcp_elicitations = true
request_permissions = true
rules = true
sandbox_approval = true
skill_approval = true

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = false
experimental_use_profile = true

# Explicit process environment; API secrets are loaded separately by systemd.
[shell_environment_policy.set]
LANG = "C.UTF-8"
LC_CTYPE = "C.UTF-8"
NODE = "/usr/local/lib/node-26/bin/node"
CODEX_HOME = "/data/codex/usr/home"
CODEX_AGENTS = "/data/codex/usr/agents"
CODEX_SKILLS = "/data/codex/usr/skills"
CODEX_HOOK_SCHEMA_DIR = "/data/codex/usr/home/.hooks/schemas"

[shell_environment_policy.filters]
".*" = "include"
".*TOKEN.*" = "exclude"
".*KEY.*" = "exclude"
".*SECRET.*" = "exclude"
".*PASSWORD.*" = "exclude"
".*PASS.*" = "exclude"
"^AWS_.*" = "exclude"
"^AZURE_.*" = "exclude"
"^GCP_.*" = "exclude"
"^OPENAI_.*" = "exclude"
"^ANTHROPIC_.*" = "exclude"
"^GITHUB_.*" = "exclude"
"^GITLAB_.*" = "exclude"
"^SSH_.*" = "exclude"
"^KUBECONFIG$" = "exclude"
"^DOCKER_.*" = "exclude"
"^NPM_TOKEN$" = "exclude"
"^NODE_AUTH_TOKEN$" = "exclude"
"^PIP_INDEX_URL$" = "exclude"
"^PIP_EXTRA_INDEX_URL$" = "exclude"

# Named permission policies. The selected default is full.
[permissions]

[permissions.full]
description = "Use full local filesystem access and broad outbound networking for authorized tasks; keep user scope and secret boundaries."

[permissions.full.filesystem]
":root" = "write"
":tmpdir" = "write"
glob_scan_max_depth = 8

[permissions.full.network]
enabled = true
mode = "full"
proxy_url = "http://127.0.0.1:8080"
socks_url = "socks5://127.0.0.1:1080"
enable_socks5 = true
enable_socks5_udp = true
allow_upstream_proxy = true
dangerously_allow_non_loopback_proxy = false
dangerously_allow_all_unix_sockets = false
allow_local_binding = true

