model = "gpt-5.6-sol"
review_model = "gpt-5.6-terra"
model_provider = "openai"
model_catalog_json = "/data/codex/usr/instructions/models/default_catalog.json"
model_instructions_file = "/data/codex/usr/instructions/default/models/base.md"
service_tier = "default"

model_context_window = 1_050_000
model_auto_compact_token_limit = 900_000
model_auto_compact_token_limit_scope = "total"
tool_output_token_limit = 20_000

model_reasoning_effort = "xhigh"
model_reasoning_summary = "detailed"
model_verbosity = "high"
plan_mode_reasoning_effort = "xhigh"

# not supported by Codex 0.147.0; retained inactive below.
# [instruction_overrides.models]
# base_instructions_file = "/data/codex/usr/instructions/default/models/base.md"

[features]
code_mode_only = true
