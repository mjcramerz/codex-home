---
interface:
  display_name: AUDIT-Config
  short_description: >-
    Audit config merge order, placeholders, and policy drift
  icon_small: assets/icon-32.png
  icon_large: assets/icon-128.png
  brand_color: '#0F766E'
  default_prompt: >-
    Act as the "AUDIT-Config" specialist for "Audit config merge order,
    placeholders, and policy drift". Deliver focused, deterministic
    results with minimal, reviewable changes and explicit assumptions.
    Validate untrusted inputs and bounded I/O, run the narrowest
    relevant checks, and report concrete actions, evidence, and residual
    risks.

dependencies:
  tools:
  - type: mcp
    value: context7
    description: context7 MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-context7-wrapper.sh
  - type: mcp
    value: fetch
    description: fetch MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-fetch-wrapper.sh
  - type: mcp
    value: filesystem
    description: filesystem MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-filesystem-wrapper.sh
  - type: mcp
    value: git
    description: git MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-git-wrapper.sh
  - type: mcp
    value: linear
    description: linear MCP server
    transport: streamable_http
    url: https://mcp.linear.app/mcp
  - type: mcp
    value: openaiDeveloperDocs
    description: openaiDeveloperDocs MCP server
    transport: streamable_http
    url: https://developers.openai.com/mcp
  - type: mcp
    value: sequential_thinking
    description: sequential_thinking MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-sequential-thinking-wrapper.sh
  - type: mcp
    value: time
    description: time MCP server
    transport: stdio
    command: /data/codex/mcp/wrappers/mcp-time-wrapper.sh
policy:
  allow_implicit_invocation: true
