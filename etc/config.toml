[permissions.workspace-online.network.unix_sockets]
"/data/codex/sockets/codex-mcp.sock" = "allow"

[permissions.workspace-online.network.mitm]

[permissions.workspace-online.network.mitm.actions]

[permissions.workspace-online.network.mitm.hooks]

[permissions.full]
description = "Explicit full-access profile: host filesystem writes and direct networking."

[permissions.full.filesystem]
":root" = "write"
":tmpdir" = "write"

[permissions.full.network]
enabled = true

[skills]
include_instructions = true
max_context_tokens = 10000
config = []

[skills.bundled]
enabled = true

[agents]
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "high"
enabled = true
max_concurrent_threads_per_session = 4
max_depth = 2
interrupt_message = true

[agents.default]
description = "Use this role for scoped coding, configuration and integration work; discover actual tools before relying on them."
config_file = "/data/codex/usr/agents/default.toml"
nickname_candidates = ["Atlas", "Forge"]

[agents.manager]
description = "Use this role to coordinate owned tasks, dependencies, acceptance criteria and evidence-backed handoffs."
config_file = "/data/codex/usr/agents/manager.toml"
nickname_candidates = ["North", "Ledger"]

[agents.orchestrator]
description = "Use this role to sequence supported subagents, manage dependent work and reconcile their results within the parent scope."
config_file = "/data/codex/usr/agents/orchestrator.toml"
nickname_candidates = ["Conductor", "Vector"]

[agents.planner]
description = "Use this role to turn the requested outcome into bounded work items, acceptance criteria, dependencies and rollback considerations."
config_file = "/data/codex/usr/agents/planner.toml"
nickname_candidates = ["Draft", "Grid"]

[agents.delegator]
description = "Use this role to select appropriate subagents and give each an explicit objective, file scope, permission ceiling and return contract."
config_file = "/data/codex/usr/agents/delegator.toml"
nickname_candidates = ["Relay", "Broker"]

[agents.worker]
description = "Use this role to complete one bounded assignment while preserving unrelated edits and reporting concrete evidence."
config_file = "/data/codex/usr/agents/worker.toml"
nickname_candidates = ["Sage", "Orbit"]

[agents.coder]
description = "Use this role to implement a scoped root-cause fix after inspecting affected interfaces and repository conventions."
config_file = "/data/codex/usr/agents/coder.toml"
nickname_candidates = ["Anchor", "Helm"]

[agents.analyst]
description = "Use this role to compare findings, resolve contradictions and separate observed evidence from hypotheses."
config_file = "/data/codex/usr/agents/analyst.toml"
nickname_candidates = ["Prism", "Delta"]

[agents.synthesizer]
description = "Use this role to combine verified findings into a coherent result without losing provenance, disagreement or uncertainty."
config_file = "/data/codex/usr/agents/synthesizer.toml"
nickname_candidates = ["Weave", "Mosaic"]

[agents.integrator]
description = "Use this role for read-only integration review, interface checks and required-mirror comparison unless implementation is separately assigned."
config_file = "/data/codex/usr/agents/integrator.toml"
nickname_candidates = ["Aegis", "Sentinel"]

[agents.hunter]
description = "Use this role to research version-sensitive behavior through available primary sources and report dates, evidence and uncertainty."
config_file = "/data/codex/usr/agents/hunter.toml"
nickname_candidates = ["Harbor", "Nimbus"]

[agents.explorer]
description = "Use this role to map repository entrypoints, callers and dependencies without modifying the workspace."
config_file = "/data/codex/usr/agents/explorer.toml"
nickname_candidates = ["Beacon", "Lens"]

[agents.reviewer]
description = "Use this role to identify concrete defects, security risks and regressions with file-and-line evidence and bounded corrective actions."
config_file = "/data/codex/usr/agents/reviewer.toml"
nickname_candidates = ["Signal", "Quill"]

[agents.tester]
description = "Use this role to reproduce the assigned issue and run relevant authorized checks; distinguish fixture results from live behavior."
config_file = "/data/codex/usr/agents/tester.toml"
nickname_candidates = ["Probe", "Relay"]

[orchestrator]

[orchestrator.mcp]
enabled = true

[orchestrator.skills]
enabled = true

